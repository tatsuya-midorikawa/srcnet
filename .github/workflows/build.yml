name: build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # 大規模コーパスの実測は所要時間が長い。定期実行と手動実行に限る。
    schedule:
        - cron: '0 18 * * 0'
    workflow_dispatch:

permissions:
    contents: read

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    PYTHONUTF8: '1'
    CI: true
    # 実測に使うコーパスはコミット SHA で固定する。追従は明示的な更新として行う。
    # v6.6（長期サポート）のタグが指すコミット。
    LINUX_CORPUS_REF: ffc253263a1375a65fa6c9f62a893e9767fbebfa

jobs:
    build-test:
        # macOS と Windows の両方が必須。一方でも未検証または失敗なら完了扱いにしない。
        # docs/testing.md 4 を参照。
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Check generated tables
              # 生成物と出典がずれたまま埋め込まれないようにする（ADR-9、backlog 020）。
              run: |
                  python tools/generate_grammar_versions.py --check
                  python tools/generate_encoding_tables.py --check

            - name: Test build tooling
              run: python -m unittest discover -s tests/tools -v

            - name: Restore
              run: dotnet restore srcnet.slnx

            - name: Build
              run: dotnet build srcnet.slnx -c Release --no-restore

            - name: Test
              # 構文解析器を構築しないジョブ。解析器が無い環境で T1 のゴールデンが通り、
              # T2 の項目が省略として明示されることを確かめる（backlog 025）。
              run: dotnet test srcnet.slnx -c Release --no-build

    parser:
        # 構文解析器（tree-sitter）は任意の構成要素なので、構築の有無を分けて検証する。
        # docs/decisions.md ADR-3 を参照。
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Verify pinned sources
              run: python tools/build_native.py --check

            - name: Build parser
              run: python tools/build_native.py --languages c cpp python go typescript tsx fsharp

            - name: Check generated grammar versions
              # 成果物へ記録する文法の版は native/sources.json を唯一の出典とする。
              # 生成物が出典とずれたまま埋め込まれないようにする（backlog 020）。
              run: python tools/generate_grammar_versions.py --check

            - name: Test with parser available
              # SRCNET_REQUIRE_PARSER=1 により、解析器が無いことを理由に T2 のゴールデンを
              # 省略した場合は失敗させる。「解析器が無いから通った」状態を成功にしない。
              env:
                  SRCNET_REQUIRE_PARSER: '1'
              run: dotnet test srcnet.slnx -c Release

    determinism:
        # T-1: 同一入力から二度生成した成果物がバイト単位で一致すること。
        # 並列度が出力に影響しないことも同時に確かめる。docs/testing.md T-1 を参照。
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Publish CLI
              run: dotnet publish src/Srcnet.Cli/Srcnet.Cli.fsproj -c Release -o artifacts/cli

            - name: Index twice and compare (POSIX)
              if: runner.os != 'Windows'
              run: python .github/scripts/determinism_contract.py --cli artifacts/cli/srcnet --root . --out artifacts/determinism

            - name: Index twice and compare (Windows)
              if: runner.os == 'Windows'
              run: python .github/scripts/determinism_contract.py --cli artifacts/cli/srcnet.exe --root . --out artifacts/determinism

            - name: Upload manifest for cross-OS comparison
              uses: actions/upload-artifact@v4
              with:
                  name: manifest-${{ matrix.os }}
                  path: artifacts/determinism/index-a/manifest.json
                  if-no-files-found: error

    cross-platform-determinism:
        # T-1 の 3: macOS で生成した成果物と Windows で生成した成果物が一致すること。
        # パス正規化・Unicode 正規化・改行の扱いを同時に検証する。
        needs: determinism
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: manifest-macos-latest
                  path: macos

            - uses: actions/download-artifact@v4
              with:
                  name: manifest-windows-latest
                  path: windows

            - name: Compare manifests
              run: diff macos/manifest.json windows/manifest.json

    query-contract:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Publish query CLI
              run: dotnet publish src/Srcnet.Cli/Srcnet.Cli.fsproj -c Release -o artifacts/query-cli

            - name: Generate portable query contracts (POSIX)
              if: runner.os != 'Windows'
              run: python .github/scripts/query_contract.py --cli artifacts/query-cli/srcnet --out artifacts/query-contract

            - name: Generate portable query contracts (Windows)
              if: runner.os == 'Windows'
              run: python .github/scripts/query_contract.py --cli artifacts/query-cli/srcnet.exe --out artifacts/query-contract

            - name: Offline Chrome and Edge contracts (macOS)
              if: runner.os == 'macOS'
              run: |
                  node --experimental-websocket .github/scripts/browser_contract.mjs \
                    --browser "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
                    --html artifacts/query-contract/portable/browser.html --out artifacts/browser-chrome
                  node --experimental-websocket .github/scripts/browser_contract.mjs \
                    --browser "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" \
                    --html artifacts/query-contract/portable/browser.html --out artifacts/browser-edge

            - name: Offline Chrome and Edge contracts (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $chrome = @(
                    "$env:ProgramFiles/Google/Chrome/Application/chrome.exe",
                    "${env:ProgramFiles(x86)}/Google/Chrome/Application/chrome.exe"
                  ) | Where-Object { Test-Path $_ } | Select-Object -First 1
                  $edge = @(
                    "$env:ProgramFiles/Microsoft/Edge/Application/msedge.exe",
                    "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe"
                  ) | Where-Object { Test-Path $_ } | Select-Object -First 1
                  if (!$chrome -or !$edge) { throw "Chrome and Edge are required for the offline contract" }
                  node --experimental-websocket .github/scripts/browser_contract.mjs --browser "$chrome" --html artifacts/query-contract/portable/browser.html --out artifacts/browser-chrome
                  if ($LASTEXITCODE -ne 0) { throw "Chrome contract failed" }
                  node --experimental-websocket .github/scripts/browser_contract.mjs --browser "$edge" --html artifacts/query-contract/portable/browser.html --out artifacts/browser-edge
                  if ($LASTEXITCODE -ne 0) { throw "Edge contract failed" }

            - name: Upload portable JSON and HTML
              uses: actions/upload-artifact@v4
              with:
                  name: query-contract-${{ matrix.os }}
                  path: artifacts/query-contract/portable/
                  if-no-files-found: error

            - name: Upload browser evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: query-browser-${{ matrix.os }}
                  path: |
                      artifacts/browser-chrome/
                      artifacts/browser-edge/

    query-cross-platform:
        needs: query-contract
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: query-contract-macos-latest
                  path: macos-query
            - uses: actions/download-artifact@v4
              with:
                  name: query-contract-windows-latest
                  path: windows-query
            - name: Compare query JSON and HTML byte for byte
              run: diff -r macos-query windows-query

    corpus-large:
        # M2 の完了条件の実測。`linux` コーパスの走査と抽出を通し、両 OS の成果物が
        # バイト単位で一致することを確かめる（docs/testing.md T-1 の 3、T-7）。
        #
        # ホスト型ランナーの時間と容量に収まらない可能性があるため、pull request では
        # 回さず、定期実行と手動実行に限る。収まらないことが確認できた場合は
        # docs/roadmap.md の未決事項「大規模コーパスを CI で回すための実行基盤」として扱う。
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Build parser
              run: python tools/build_native.py --languages c cpp

            - name: Publish CLI
              run: dotnet publish src/Srcnet.Cli/Srcnet.Cli.fsproj -c Release -o artifacts/cli

            # コーパスはコミット SHA で固定する（docs/testing.md 5）。
            # キャッシュして毎回の取得を避ける。
            - name: Restore corpus cache
              id: corpus-cache
              uses: actions/cache@v4
              with:
                  path: corpus/linux
                  key: corpus-linux-${{ runner.os }}-${{ env.LINUX_CORPUS_REF }}

            - name: Fetch corpus
              if: steps.corpus-cache.outputs.cache-hit != 'true'
              run: |
                  git clone --config core.autocrlf=false --config core.longpaths=true --filter=blob:none --no-checkout https://github.com/torvalds/linux.git corpus/linux
                  git -C corpus/linux checkout ${{ env.LINUX_CORPUS_REF }}

            - name: Verify corpus revision and checkout
              shell: bash
              run: |
                  test "$(git -C corpus/linux rev-parse HEAD)" = "$LINUX_CORPUS_REF"
                  git -C corpus/linux diff --exit-code HEAD

            - name: Index (POSIX)
              if: runner.os != 'Windows'
              run: |
                  status=0
                  /usr/bin/time -l ./artifacts/cli/srcnet index corpus/linux --out artifacts/linux --tier 2 --json > artifacts/index.json 2> artifacts/index.time || status=$?
                  cat artifacts/index.json
                  cat artifacts/index.time
                  if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then exit "$status"; fi
                  python -c "import json; assert json.load(open('artifacts/index.json', encoding='utf-8'))['complete']"

            - name: Index (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $measured = Measure-Command {
                    ./artifacts/cli/srcnet.exe index corpus/linux --out artifacts/linux --tier 2 --json > artifacts/index.json
                    if ($LASTEXITCODE -notin @(0, 4)) { throw "Index failed: $LASTEXITCODE" }
                  }
                  "elapsed_seconds=$($measured.TotalSeconds)" | Out-File artifacts/index.time
                  Get-Content artifacts/index.json
                  if (!(Get-Content artifacts/index.json -Raw | ConvertFrom-Json).complete) { throw "Incomplete corpus scan" }

            - name: Verify
              if: runner.os != 'Windows'
              run: ./artifacts/cli/srcnet verify corpus/linux --out artifacts/linux

            - name: Verify (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: ./artifacts/cli/srcnet.exe verify corpus/linux --out artifacts/linux

            - name: Upload measurements
              uses: actions/upload-artifact@v4
              with:
                  name: corpus-linux-${{ matrix.os }}
                  path: |
                      artifacts/index.json
                      artifacts/index.time
                      artifacts/linux/manifest.json

    corpus-large-determinism:
        # 両 OS の成果物がバイト単位で一致すること（T-1 の 3）。
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        needs: corpus-large
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: corpus-linux-macos-latest
                  path: macos

            - uses: actions/download-artifact@v4
              with:
                  name: corpus-linux-windows-latest
                  path: windows

            - name: Compare manifests
              run: diff macos/linux/manifest.json windows/linux/manifest.json

    deps-audit:
        # T-3: 製品コードの依存閉包にネットワーク クライアントとモデル ランタイムが
        # 含まれないことを検査する。docs/testing.md T-3 を参照。
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Publish CLI
              run: dotnet publish src/Srcnet.Cli/Srcnet.Cli.fsproj -c Release -o artifacts/cli

            - name: Assert no third-party runtime dependency
              run: python3 .github/scripts/check_dependency_closure.py artifacts/cli/srcnet.deps.json

            - name: Vulnerability scan
              run: |
                  dotnet restore srcnet.slnx --force-evaluate -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low
                  dotnet list srcnet.slnx package --vulnerable --include-transitive
